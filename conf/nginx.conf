# Instance discovery for clients
location = /.well-known/stoat {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    alias __INSTALL_DIR__/stoat.json;
}

# REST API (delta)
location = /api {
    proxy_pass http://127.0.0.1:__PORT_API__/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/ {
    proxy_pass http://127.0.0.1:__PORT_API__/;
    proxy_redirect / /api/;
    client_max_body_size 25M;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Events websocket (bonfire)
location = /ws {
    proxy_pass http://127.0.0.1:__PORT_EVENTS__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# File server (autumn)
location /autumn/ {
    proxy_pass http://127.0.0.1:__PORT_AUTUMN__/;
    proxy_redirect / /autumn/;
    client_max_body_size 25M;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Metadata and image proxy (january)
location /january/ {
    proxy_pass http://127.0.0.1:__PORT_JANUARY__/;
    proxy_redirect / /january/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Tenor proxy (gifbox)
location /gifbox/ {
    proxy_pass http://127.0.0.1:__PORT_GIFBOX__/;
    proxy_redirect / /gifbox/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# LiveKit signalling websocket
location /livekit/ {
    proxy_pass http://127.0.0.1:__PORT_LIVEKIT__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Web client (static, SPA)
location / {
    root __INSTALL_DIR__/web;
    index index.html;
    try_files $uri $uri/ /index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    more_set_headers "Content-Security-Policy: upgrade-insecure-requests";
}
