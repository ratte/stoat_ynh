# Instance discovery for clients
location = /.well-known/stoat {
    default_type application/json;
    more_set_headers "Access-Control-Allow-Origin: *";
    alias __INSTALL_DIR__/stoat.json;
}

# REST API (delta)
location = /api {
    proxy_pass http://127.0.0.1:__PORT_API__/;
    include proxy_params_no_auth;
}
location /api/ {
    proxy_pass http://127.0.0.1:__PORT_API__/;
    proxy_redirect / /api/;
    client_max_body_size 25M;
    include proxy_params_no_auth;
}

# Events websocket (bonfire)
location = /ws {
    proxy_pass http://127.0.0.1:__PORT_EVENTS__/;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include proxy_params_no_auth;
}

# File server (autumn)
location /autumn/ {
    proxy_pass http://127.0.0.1:__PORT_AUTUMN__/;
    proxy_redirect / /autumn/;
    client_max_body_size 25M;
    proxy_request_buffering off;
    include proxy_params_no_auth;
}

# Metadata and image proxy (january)
location /january/ {
    proxy_pass http://127.0.0.1:__PORT_JANUARY__/;
    proxy_redirect / /january/;
    include proxy_params_no_auth;
}

# Tenor proxy (gifbox)
location /gifbox/ {
    proxy_pass http://127.0.0.1:__PORT_GIFBOX__/;
    proxy_redirect / /gifbox/;
    include proxy_params_no_auth;
}

# LiveKit signalling websocket
location /livekit/ {
    proxy_pass http://127.0.0.1:__PORT_LIVEKIT__/;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include proxy_params_no_auth;
}

# Web client (static, SPA)
location / {
    root __INSTALL_DIR__/web;
    index index.html;
    try_files $uri $uri/ /index.html;

    location = /index.html {
        more_set_headers "Cache-Control: no-cache";
    }
    location = /sw.js {
        more_set_headers "Cache-Control: no-cache";
    }

    more_set_headers "Content-Security-Policy: upgrade-insecure-requests";
}
